spring.application.name=demo

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# 6주차 JWT 설정
# 서명 키는 32바이트(256비트) 이상이어야 한다. 실제 서버에서는 JWT_SECRET 환경 변수로 넣고, 아래 기본값은 로컬 개발용이다.
jwt.secret=${JWT_SECRET:local-dev-only-secret-key-please-change-0123456789}
jwt.access-token-validity-seconds=600
jwt.refresh-token-validity-seconds=604800
