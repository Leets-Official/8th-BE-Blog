spring.application.name=8th-BE-Blog

# H2 인메모리 DB (서버를 끄면 데이터가 초기화된다)
spring.datasource.url=jdbc:h2:mem:blog;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# 테이블 생성 후 data.sql로 테스트용 회원을 넣는다
spring.jpa.defer-datasource-initialization=true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method

# JWT: 서명 키는 환경 변수 JWT_SECRET이 있으면 그 값을 쓰고, 없으면 로컬 개발용 키를 쓴다.
jwt.secret=${JWT_SECRET:rTMrxH0ukrRf0vofm+B89BrQPrppHYsK5wjEQsxdOIKgELS1UFsQLfqBG8mBfZtl}
jwt.access-token-validity=30m
jwt.refresh-token-validity=14d
