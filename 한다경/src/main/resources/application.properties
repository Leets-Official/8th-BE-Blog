spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:leets_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.override-with-generic-response=false

# Exclude basic assignment endpoints from API documentation only.
springdoc.paths-to-exclude=/health,/string/repeat
