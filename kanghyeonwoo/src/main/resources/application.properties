spring.application.name=kanghyeonwoo

# Persistent local database; tests supply their own in-memory datasource.
spring.datasource.url=${BLOG_DB_URL:jdbc:h2:file:./data/blog}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.time-zone=Asia/Seoul

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true


# Empty JWT secret uses a process-local random key for local practice; configure a persistent key in deployment.
auth.jwt-secret=${JWT_SECRET:}
auth.kakao.client-id=${KAKAO_CLIENT_ID:}
auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
auth.kakao.callback=${KAKAO_CALLBACK_URL:}
auth.kakao.frontend=${KAKAO_FRONTEND_URL:}
