plugins {
    id 'java'
    id 'pmd'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.leets_8th_be'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'net.datafaker:datafaker:2.7.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Uses BLOG_DB_URL when set; otherwise adds fixtures to the existing local data/blog database.
tasks.register('seedMockData', JavaExec) {
    group = 'application'
    description = '사용자·게시글·댓글 목 데이터를 중복 없이 저장하고 종료합니다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.leets_8th_be.kanghyeonwoo.config.MockDataLoader'
    workingDir = projectDir
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        palantirJavaFormat('2.102.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

pmd {
    toolVersion = '7.10.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

// Keep existing developer commands while Spotless owns the implementation.
tasks.register('javaFormat') {
    group = 'formatting'
    description = 'Alias for spotlessApply.'
    dependsOn 'spotlessApply'
}

tasks.register('javaFormatCheck') {
    group = 'verification'
    description = 'Alias for spotlessCheck.'
    dependsOn 'spotlessCheck'
}
