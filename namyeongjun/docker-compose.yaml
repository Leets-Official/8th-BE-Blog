services:
  app:
    image: nanajun/leets8:latest
    container_name: leets-8
    ports:
      - "8080:8080"
    env_file:
      - ./.env.dev
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: leets-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


