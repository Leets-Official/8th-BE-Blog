spring:
  application:
    name: 8th-be-blog
  datasource:
    url: jdbc:mysql://localhost:3306/blog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}            # Base64 문자열, 디코딩했을 때 32바이트 이상 (HS256)
  access-token-validity: 30m
  refresh-token-validity: 14d

kakao:
  client-id: ${KAKAO_CLIENT_ID:}              # REST API 키 (없으면 앱은 뜨지만 카카오 로그인만 실패)
  client-secret: ${KAKAO_CLIENT_SECRET:}      # [보안] Client Secret을 켰을 때만 필요
  redirect-uri: http://localhost:8080/auth/kakao/callback   # 카카오 디벨로퍼스에 등록한 값과 똑같아야 함
