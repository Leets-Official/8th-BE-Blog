spring.application.name=demo

# Set MYSQL_PASSWORD in the shell or IDE environment before starting.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/blog_db?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL owns table creation; Hibernate only validates the entity mappings.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
